<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to SyncText</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    .card { text-align: center; padding: 48px; max-width: 420px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .loader {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .loader span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0a1124;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loader span:nth-child(1) { animation-delay: -0.32s; }
    .loader span:nth-child(2) { animation-delay: -0.16s; }
    .loader span:nth-child(3) { animation-delay: 0s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    p { font-size: 14px; opacity: 0.6; margin-bottom: 24px; }
    p strong { opacity: 1; font-weight: 800; }
    a {
      display: inline-block;
      padding: 12px 32px;
      background: #0a1124;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SyncText</h1>
    <div class="loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <p>Redirecting in <strong id="count">5</strong> seconds...</p>
    <a href="https://synctext.pvlm.site">Go to SyncText</a>
  </div>
  <script>
    var s = 5;
    var el = document.getElementById('count');
    var iv = setInterval(function() {
      s--;
      if (s <= 0) { clearInterval(iv); s = 0; }
      el.textContent = s;
    }, 1000);
    setTimeout(function() { location.href = 'https://synctext.pvlm.site'; }, 5000);
  </script>
</body>
</html>
