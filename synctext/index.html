<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="5;url=https://synctext.pvlm.site">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:48px 40px;max-width:420px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
h1{font-size:24px;font-weight:900;margin-bottom:6px}
.sub{font-size:14px;color:#86868b;margin-bottom:28px;line-height:1.5}
.url{font-size:15px;font-weight:700;color:#0a1124;background:#f5f5f7;border-radius:12px;padding:14px 20px;margin-bottom:24px}
.timer{font-size:12px;color:#86868b;margin-bottom:20px}
.timer span{font-weight:700;color:#1d1d1f}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border:none;border-radius:12px;background:#0a1124;color:#fff;font-family:'Outfit',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:all 0.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(10,17,36,0.3)}
.btn svg{width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="card">
<h1>SyncText has moved</h1>
<p class="sub">We have a new home. Update your bookmarks to the new URL below.</p>
<div class="url">synctext.pvlm.site</div>
<p class="timer">Redirecting in <span id="count">5</span>s</p>
<a href="https://synctext.pvlm.site" class="btn">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
Go to SyncText
</a>
</div>
<script>
var s=5;setInterval(function(){if(s>0){s--;document.getElementById('count').textContent=s}},1000);
</script>
</body>
</html>
