<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a1124;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:40px;max-width:400px;width:100%;text-align:center}
h1{font-size:22px;font-weight:900;margin-bottom:8px}
.sub{font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:24px}
.url{font-size:14px;font-weight:700;color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 16px;margin-bottom:24px;font-family:'Outfit',sans-serif}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border:none;border-radius:12px;background:#fff;color:#0a1124;font-family:'Outfit',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:all 0.2s}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:16px;height:16px}
</style>
</head>
<body>
<div class="card">
<h1>SyncText has moved</h1>
<p class="sub">We have a new URL. Update your bookmarks.</p>
<div class="url">synctext.pvlm.site</div>
<a href="https://synctext.pvlm.site" class="btn">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
Go to SyncText
</a>
</div>
</body>
</html>
